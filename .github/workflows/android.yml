name: Build APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Run unit tests (fiskalizacijska jezgra)
        run: gradle test --stacktrace

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk fiskal-obrt.apk

      - name: Upload APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: fiskal-obrt-debug-apk
          path: fiskal-obrt.apk
          if-no-files-found: error

      - name: Publish APK to Release (direktan download)
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Najnoviji APK (Fiskal Obrt)
          body: |
            Najnoviji build aplikacije. Skini **fiskal-obrt.apk** ispod i instaliraj na Android.
            Commit: ${{ github.sha }}
          files: fiskal-obrt.apk
          prerelease: true
